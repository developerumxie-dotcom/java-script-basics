<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <input type="text" id="txt1" />
    <button id="sample">click here</button>
    <h1 id="hed1"></h1>
    <button id="btn2" style="background-color: red">red</button>
    <button id="btn3" style="background-color: green">green</button>

    <script>
      let inputt = document.getElementById("txt1");
      let buttonClick = document.getElementById("sample");
      let output = document.getElementById("hed1");
      let redButton = document.getElementById("btn2");
      let greenButton = document.getElementById("btn3");

      buttonClick.addEventListener("click", () => {
        output.innerHTML = inputt.value;
      });

      const colorChange = (clr) => {
        output.style.color = clr
      };

      redButton.addEventListener("mouseover", () => {
        colorChange("red");
      });

      greenButton.addEventListener("mouseover", () => {
        colorChange("green");
      });
    </script>
  </body>
</html>
